<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-Study Scheduler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Smart-Study Scheduler</h1>
        <p>AI-Powered Task Planning</p>
    </header>

    <main>
        <section class="input-section">
            <h2>Add a New Task</h2>
            <form id="task-form">
                <label for="task-name">Task Name:</label>
                <input type="text" id="task-name" required>

                <label for="due-date">Due Date:</label>
                <input type="date" id="due-date" required>

                <label for="effort">Estimated Effort (Hours):</label>
                <input type="number" id="effort" min="0.5" step="0.5" required>

                <button type="submit">Generate Schedule</button>
            </form>
        </section>

        <section class="schedule-section">
            <h2>Your Schedule</h2>
            <div id="calendar-view">
                <p class="placeholder-text">Enter a task above to let the AI build your schedule...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
